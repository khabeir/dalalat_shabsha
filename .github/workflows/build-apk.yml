name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: |
          flutter create --platforms=android --project-name dalalat_shabsha .

      - name: Remove default test
        run: rm -f test/widget_test.dart

      - name: Set Arabic app name
        run: |
          python - <<'PY2'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = s.replace(
              'android:label="dalalat_shabsha"',
              'android:label="دلالة شبشة"'
          )

          p.write_text(s)
          PY2

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dalalat-shabsha-apk
          path: build/app/outputs/flutter-apk/app-release.apk
