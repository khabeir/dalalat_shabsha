name: Build Android APK

on:
  push:
    branches:
      - restore-16d57d8
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Verify source files
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo "=== LIB ==="
          find lib -maxdepth 2 -type f | sort

          echo "=== HOME SCREEN ==="
          test -f lib/screens/home_screen.dart

          echo "=== MAIN ==="
          test -f lib/main.dart

          echo "=== GIT COMMIT ==="
          git log -1 --oneline

      - name: Create Android project separately
        run: |
          rm -rf /tmp/dalalat_android

          flutter create \
            --platforms=android \
            --project-name dalalat_shabsha \
            /tmp/dalalat_android

          rm -rf android
          cp -R /tmp/dalalat_android/android ./android

      - name: Verify source files after Android creation
        run: |
          echo "=== LIB AFTER FLUTTER CREATE ==="
          find lib -maxdepth 2 -type f | sort

          echo "=== CHECK HOME SCREEN ==="
          test -f lib/screens/home_screen.dart

          echo "=== CHECK MAIN ==="
          test -f lib/main.dart

      - name: Add Android Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = (
              '    <uses-permission '
              'android:name="android.permission.INTERNET" />'
          )

          if "android.permission.INTERNET" not in s:
              marker = "<application"
              s = s.replace(
                  marker,
                  permission + "\n\n    " + marker,
                  1
              )

          p.write_text(s)
          PY

      - name: Remove default test
        run: |
          rm -f test/widget_test.dart

      - name: Set Arabic app name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          s = s.replace(
              'android:label="dalalat_shabsha"',
              'android:label="دلالة شبشة"'
          )

          p.write_text(s)
          PY

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Analyze
        run: |
          flutter analyze

      - name: Build APK
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://newtahnyvxbydpsbxgew.supabase.co \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dalalat-shabsha-apk
          path: build/app/outputs/flutter-apk/app-release.apk
